name: Generate Kinetic Reel

# Renders one prompted reel in the cloud and optionally delivers it to Telegram.
#
# Security notes (these are deliberate — do not "simplify" them back):
#  - Inputs reach the shell only through `env:`. Interpolating ${{ inputs.* }}
#    straight into a `run:` block is a command-injection hole: a topic
#    containing a quote and $(...) would execute on the runner, where the API
#    secrets live.
#  - chat_id is validated as digits before it is used.
#  - The workflow has no write permissions beyond the artifact upload.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic, idea or full script'
        required: true
        default: 'why specialty coffee costs so much'
      duration:
        description: 'Target length in seconds'
        required: true
        default: '30'
      voice:
        description: 'Voice (Fenrir, Puck, Charon, Kore, Aoede)'
        required: true
        default: 'Fenrir'
      style:
        description: 'Style (fares-editorial, swiss-editorial, cyber-matrix, minimal-luxury)'
        required: true
        default: 'fares-editorial'
      pace:
        description: 'Pace (calm, standard, rapid)'
        required: true
        default: 'standard'
      aspect:
        description: 'Aspect ratio (9:16, 4:5, 1:1, 16:9)'
        required: true
        default: '9:16'
      image_quality:
        description: 'Image quality (high, max)'
        required: true
        default: 'high'
      chat_id:
        description: 'Telegram chat id (optional, digits only)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TOPIC: ${{ inputs.topic }}
      DURATION: ${{ inputs.duration }}
      VOICE: ${{ inputs.voice }}
      STYLE: ${{ inputs.style }}
      PACE: ${{ inputs.pace }}
      ASPECT: ${{ inputs.aspect }}
      IMAGE_QUALITY: ${{ inputs.image_quality }}
      CHAT_ID: ${{ inputs.chat_id }}
      # Applies to every npx call in the job (vendor, check, render).
      HYPERFRAMES_NO_UPDATE_CHECK: '1'
      # Keep the CLI's anonymous telemetry off in CI.
      DO_NOT_TRACK: '1' 

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-noto-core

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Vendor render runtime (GSAP, fonts)
        run: npm run vendor

      - name: Unit tests
        run: npm test

      - name: Generate reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node create-reel.mjs "$TOPIC" \
            --duration "$DURATION" \
            --voice "$VOICE" \
            --style "$STYLE" \
            --pace "$PACE" \
            --aspect "$ASPECT" \
            --image-quality "$IMAGE_QUALITY" \
            --contact-sheet \
            --output "final-reel.mp4" \
            --json > result.json

      - name: Show result
        run: |
          cat result.json
          {
            echo "## Kinetic Reel"
            echo '```json'
            cat result.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: kinetic-reel
          path: |
            final-reel.mp4
            result.json
            scratch/**/cover.jpg
            scratch/**/contact-sheet.jpg
          if-no-files-found: error

      - name: Send to Telegram
        if: ${{ env.CHAT_ID != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          case "$CHAT_ID" in
            ''|*[!0-9-]*) echo "::warning::chat_id must be numeric — skipping delivery"; exit 0 ;;
          esac
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN secret is not set — skipping delivery"
            exit 0
          fi
          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo" \
            -F "chat_id=${CHAT_ID}" \
            -F "video=@final-reel.mp4" \
            -F "supports_streaming=true" \
            -F "caption=Kinetic Reel — ${TOPIC} (${DURATION}s, ${STYLE})"
